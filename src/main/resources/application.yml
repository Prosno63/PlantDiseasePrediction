server: { port: 8080 }
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://10.42.53.28:5436/inventory
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate: { ddl-auto: "${DDL_AUTO:validate}" }
  servlet: { multipart: { max-file-size: 5MB, max-request-size: 5MB } }
  mvc:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5500}"
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept
      allow-credentials: true
ai-service:
  base-url: "${AI_SERVICE_BASE_URL}"
  api-key: "${AI_SERVICE_API_KEY}"
jwt:
  secret: "${JWT_SECRET}"
  expiration-minutes: 60
  refresh-expiration-days: 30
